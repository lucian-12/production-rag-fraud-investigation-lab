services:
  database:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag_demo
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_demo"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - rag_demo_data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DEMO_STORAGE: postgres
      DATABASE_URL: postgresql://rag:rag@database:5432/rag_demo
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  rag_demo_data:
